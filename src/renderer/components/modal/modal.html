<!-- ============================================================
     ThreeMarket POS - Product Modal
     Modal used to create and edit products.
     ============================================================ -->

<div
    id="productModal"
    class="modal-overlay"
    style="display: none;"
>

    <!-- Product Modal -->
    <div class="modal">

        <!-- Modal Header -->
        <div class="modal-header">

            <div>
                <h2 data-i18n="products.modal.title">
                    Add Product
                </h2>

                <p data-i18n="products.modal.subtitle">
                    Add a new product to your inventory
                </p>
            </div>

            <button
                type="button"
                id="closeProductModal"
                class="modal-close"
            >
                ×
            </button>

        </div>


        <!-- Product Form -->
        <form
            id="productForm"
            class="product-form"
        >

            <!-- Product Name -->
            <div class="form-group">

                <label for="productName">
                    <span data-i18n="products.form.name">
                        Product Name
                    </span>

                    <span class="required">
                        *
                    </span>
                </label>

                <input
                    type="text"
                    id="productName"
                    name="name"
                    required
                    autocomplete="off"
                >

            </div>


            <!-- SKU -->
            <div class="form-group">

                <label for="productSku">
                    <span data-i18n="products.form.sku">
                        SKU
                    </span>
                </label>

                <input
                    type="text"
                    id="productSku"
                    name="sku"
                    autocomplete="off"
                >

            </div>


            <!-- Barcode -->
            <div class="form-group">

                <label for="productBarcode">
                    <span data-i18n="products.form.barcode">
                        Barcode
                    </span>
                </label>

                <input
                    type="text"
                    id="productBarcode"
                    name="barcode"
                    autocomplete="off"
                >

            </div>


            <!-- Category -->
            <div class="form-group">

                <label for="productCategory">
                    <span data-i18n="products.form.category">
                        Category
                    </span>
                </label>

                <input
                    type="text"
                    id="productCategory"
                    name="category"
                    autocomplete="off"
                >

            </div>


            <!-- Price -->
            <div class="form-group">

                <label for="productPrice">

                    <span data-i18n="products.form.price">
                        Price
                    </span>

                    <span class="required">
                        *
                    </span>

                </label>

                <input
                    type="number"
                    id="productPrice"
                    name="price"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <!-- Quantity -->
            <div class="form-group">

                <label for="productQuantity">

                    <span data-i18n="products.form.quantity">
                        Quantity
                    </span>

                </label>

                <input
                    type="number"
                    id="productQuantity"
                    name="quantity"
                    min="0"
                    step="1"
                    value="0"
                >

            </div>


            <!-- Minimum Stock -->
            <div class="form-group">

                <label for="productMinStock">

                    <span data-i18n="products.form.minStock">
                        Minimum Stock
                    </span>

                </label>

                <input
                    type="number"
                    id="productMinStock"
                    name="minStock"
                    min="0"
                    step="1"
                    value="0"
                >

            </div>


            <!-- Active Status -->
            <div class="form-group checkbox-group">

                <label>

                    <input
                        type="checkbox"
                        id="productActive"
                        name="active"
                        checked
                    >

                    <span data-i18n="products.form.active">
                        Active Product
                    </span>

                </label>

            </div>


            <!-- Form Error -->
            <div
                id="productFormError"
                class="form-error"
                style="display: none;"
            ></div>


            <!-- Modal Actions -->
            <div class="modal-actions">

                <button
                    type="button"
                    id="cancelProductButton"
                    class="secondary-button"
                >
                    <span data-i18n="common.cancel">
                        Cancel
                    </span>
                </button>

                <button
                    type="submit"
                    id="saveProductButton"
                    class="primary-button"
                >
                    <span data-i18n="common.save">
                        Save Product
                    </span>
                </button>

            </div>

        </form>

    </div>

</div>
