<header class="topbar">

    <div class="topbar-title">
        <h1 data-i18n="dashboard.title">Dashboard</h1>
        <p data-i18n="dashboard.welcome">Welcome back — here's today at a glance.</p>
    </div>

    <div class="topbar-search">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="7" cy="7" r="4.3" stroke="currentColor" stroke-width="1.4"/>
            <path d="M13 13L10.3 10.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <input type="text" data-i18n-placeholder="dashboard.searchPlaceholder" placeholder="Search products, orders, customers…">
    </div>

    <div class="user-area">

        <button id="languageButton" class="language-button">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M1.5 7H12.5M7 1.5C8.4 3 9.1 4.9 9.1 7C9.1 9.1 8.4 11 7 12.5C5.6 11 4.9 9.1 4.9 7C4.9 4.9 5.6 3 7 1.5Z" stroke="currentColor" stroke-width="1.3"/>
            </svg>
            <span class="lang-label">العربية</span>
        </button>

        <div class="user-chip">
            <div class="user-avatar" id="userAvatar">A</div>

            <div class="user-info">
                <strong id="currentUsername">Admin</strong>
                <span id="currentRole">Administrator</span>
            </div>
        </div>

    </div>

</header>
