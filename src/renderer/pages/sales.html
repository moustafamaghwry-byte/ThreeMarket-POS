<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreeMarket POS — Sales</title>

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/products.css">
    <link rel="stylesheet" href="/css/sales.css">
    <base target="_blank">
</head>

<body>

    <div class="app-layout">

        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Topbar -->
            <div id="topbar-container"></div>

            <!-- Sales Workspace -->
            <section class="sales-content">

                <!-- Left: Product Catalog & Search -->
                <div class="sales-catalog">

                    <div class="catalog-header">
                        <div class="barcode-input-wrap">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V7"/>
                                <path d="M3 7l9-4 9 4"/>
                            </svg>
                            <input
                                type="text"
                                id="barcodeInput"
                                data-i18n-placeholder="sales.barcodePlaceholder"
                                placeholder="Scan barcode or type SKU…"
                                autocomplete="off"
                            >
                        </div>

                        <div class="catalog-search-wrap">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <circle cx="7" cy="7" r="4.3" stroke="currentColor" stroke-width="1.4"/>
                                <path d="M13 13L10.3 10.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                            </svg>
                            <input
                                type="text"
                                id="catalogSearch"
                                data-i18n-placeholder="sales.searchPlaceholder"
                                placeholder="Search products…"
                                autocomplete="off"
                            >
                        </div>
                    </div>

                    <div class="catalog-grid" id="catalogGrid">
                        <!-- Products injected here -->
                    </div>

                </div>

                <!-- Right: Cart / Ticket -->
                <div class="sales-cart">

                    <div class="cart-header">
                        <h2>
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M2.5 3H3.9L4.55 6M4.55 6L5.6 11.4C5.75 12.15 6.41 12.68 7.18 12.68H13.4C14.15 12.68 14.8 12.17 14.97 11.44L16 6.9H4.55Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                                <circle cx="7.5" cy="15.3" r="1" fill="currentColor"/>
                                <circle cx="13" cy="15.3" r="1" fill="currentColor"/>
                            </svg>
                            <span data-i18n="sales.currentSale">Current Sale</span>
                        </h2>
                        <div class="cart-header-actions">
                            <button id="holdOrderBtn" class="cart-hold" type="button" data-i18n="sales.hold.hold">⏸ Hold</button>
                            <button id="heldOrdersToggle" class="cart-held-toggle" type="button">
                                📋 <span data-i18n="sales.hold.heldOrders">Held</span> (<span id="heldCount">0</span>)
                            </button>
                            <button id="voidLastSaleBtn" class="cart-void" type="button" data-i18n="sales.voidLastSale">Void Last Sale</button>
                            <button id="clearCartBtn" class="cart-clear" type="button" data-i18n="sales.clear">Clear</button>
                        </div>
                    </div>

                    <!-- Held Orders Panel -->
                    <div id="heldOrdersPanel" class="held-orders-panel" style="display:none;">
                        <div class="held-orders-header">
                            <strong data-i18n="sales.hold.heldOrders">Held Orders</strong>
                            <button id="closeHeldPanel" class="modal-close" style="position:static;">×</button>
                        </div>
                        <ul id="heldOrdersList" class="held-orders-list"></ul>
                    </div>

                    <div class="cart-body" id="cartBody">
                        <div class="cart-empty" id="cartEmpty">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <circle cx="9" cy="21" r="1"/>
                                <circle cx="20" cy="21" r="1"/>
                                <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
                            </svg>
                            <p data-i18n="sales.cartEmpty">Scan a barcode or pick a product to start</p>
                        </div>
                        <div class="cart-items" id="cartItems"></div>
                    </div>

                    <div class="cart-footer">

                        <div class="discount-row">
                            <label for="discountValue" data-i18n="sales.discount">Discount</label>
                            <div class="discount-controls">
                                <input type="text" inputmode="decimal" id="discountValue" placeholder="0" value="0">
                                <div class="discount-type-toggle">
                                    <button type="button" class="discount-type-btn active" data-type="percent">%</button>
                                    <button type="button" class="discount-type-btn" data-type="fixed" data-i18n="sales.discountFixed">EGP</button>
                                </div>
                            </div>
                        </div>

                        <div class="cart-summary">
                            <div class="summary-row">
                                <span data-i18n="sales.subtotal">Subtotal</span>
                                <strong id="subtotal">0.00</strong>
                            </div>
                            <div class="summary-row" id="discountRow" style="display: none;">
                                <span data-i18n="sales.discountApplied">Discount</span>
                                <strong id="discountAmount" class="discount-value">-0.00</strong>
                            </div>
                            <div class="summary-row">
                                <span data-i18n="sales.tax">Tax (14%)</span>
                                <strong id="tax">0.00</strong>
                            </div>
                            <div class="summary-row total">
                                <span data-i18n="sales.total">Total</span>
                                <strong id="total">0.00</strong>
                            </div>
                        </div>

                        <button id="checkoutBtn" class="checkout-button" disabled>
                            <span data-i18n="sales.charge">Charge</span>
                            <span id="checkoutTotal">0.00</span>
                        </button>
                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal-overlay" style="display: none;">
        <div class="modal checkout-modal">
            <div class="modal-header">
                <h2 data-i18n="sales.checkout.title">Checkout</h2>
                <button id="closeCheckoutModal" class="modal-close">×</button>
            </div>

            <div class="checkout-body">
                <div class="checkout-total-display">
                    <span data-i18n="sales.checkout.totalToPay">Total to Pay</span>
                    <strong id="modalTotal">0.00</strong>
                </div>

                <!-- Split Payment Section -->
                <div class="split-payment-section" id="splitPaymentSection">
                    <div class="split-payment-header">
                        <label data-i18n="sales.checkout.splitPayment">Split Payment</label>
                        <button type="button" id="addPaymentBtn" class="add-payment-btn">+ Add Payment</button>
                    </div>
                    
                    <div class="split-payments-list" id="splitPaymentsList">
                        <!-- Payment rows injected here -->
                    </div>
                    
                    <div class="split-payment-summary">
                        <div class="split-row">
                            <span data-i18n="sales.checkout.totalToPay">Total to Pay</span>
                            <strong id="splitTotalDue">0.00</strong>
                        </div>
                        <div class="split-row">
                            <span data-i18n="sales.checkout.paidSoFar">Paid So Far</span>
                            <strong id="splitPaidSoFar">0.00</strong>
                        </div>
                        <div class="split-row remaining" id="splitRemainingRow">
                            <span data-i18n="sales.checkout.remaining">Remaining</span>
                            <strong id="splitRemaining">0.00</strong>
                        </div>
                    </div>
                </div>

                <!-- Single Payment (Cash/Card) - hidden when split is active -->
                <div class="payment-methods" id="singlePaymentMethods">
                    <button type="button" class="pay-method active" data-method="cash">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="6" width="20" height="12" rx="2"/>
                            <circle cx="12" cy="12" r="2"/>
                            <path d="M6 12h.01M18 12h.01"/>
                        </svg>
                        <span data-i18n="sales.checkout.cash">Cash</span>
                    </button>
                    <button type="button" class="pay-method" data-method="card">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="1" y="4" width="22" height="16" rx="2"/>
                            <line x1="1" y1="10" x2="23" y2="10"/>
                        </svg>
                        <span data-i18n="sales.checkout.card">Card</span>
                    </button>
                </div>

                <!-- Toggle Split Payment -->
                <div class="split-toggle">
                    <button type="button" id="toggleSplitBtn" class="secondary-button" data-i18n="sales.checkout.enableSplit">
                        Enable Split Payment
                    </button>
                </div>

                <!-- Quick Cash: Exact Only -->
                <div class="quick-cash-grid" id="quickCashGrid">
                    <button type="button" class="quick-cash-btn" data-action="exact" data-i18n="sales.checkout.exact">Exact</button>
                </div>

                <!-- Cash Received (single payment only) -->
                <div class="form-group" id="cashReceivedWrap">
                    <label data-i18n="sales.checkout.received">Received</label>
                    <input type="text" inputmode="decimal" id="cashReceived" placeholder="0.00">
                </div>

                <!-- Change (single payment only) -->
                <div class="checkout-change" id="changeDisplay" style="display: none;">
                    <span data-i18n="sales.checkout.change">Change</span>
                    <strong id="changeAmount">0.00</strong>
                </div>

                <!-- Sale Note -->
                <div class="form-group" style="margin-top:12px;">
                    <label data-i18n="sales.checkout.saleNote">Sale Note</label>
                    <input type="text" id="saleNote" data-i18n-placeholder="sales.checkout.saleNotePlaceholder" placeholder="e.g. Deliver after 5 PM" autocomplete="off">
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" id="cancelCheckoutBtn" class="secondary-button" data-i18n="sales.checkout.cancel">Cancel</button>
                <button type="button" id="confirmCheckoutBtn" class="primary-button" data-i18n="sales.checkout.complete">Complete Sale</button>
            </div>
        </div>
    </div>

    <!-- Receipt Modal -->
    <div id="receiptModal" class="modal-overlay" style="display: none;">
        <div class="modal receipt-modal">
            <div class="modal-header receipt-modal-header">
                <h2 data-i18n="sales.receipt.title">Receipt</h2>
                <button id="closeReceiptModal" class="modal-close">×</button>
            </div>

            <div class="receipt-paper" id="receiptPaper">
                <!-- Populated dynamically by sales.js -->
            </div>

            <div class="modal-actions receipt-modal-actions">
                <button type="button" id="newSaleBtn" class="secondary-button" data-i18n="sales.receipt.newSale">New Sale</button>
                <button type="button" id="reprintBtn" class="secondary-button" style="display:none;" data-i18n="sales.receipt.reprint">Reprint</button>
                <button type="button" id="printReceiptBtn" class="primary-button" data-i18n="sales.receipt.print">Print</button>
            </div>
        </div>
    </div>

    <script type="module" src="/js/sales.js"></script>

</body>

</html>
