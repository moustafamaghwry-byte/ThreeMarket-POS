<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreeMarket POS — Products</title>

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/products.css">
<base target="_blank">
</head>

<body>

    <div class="app-layout">

        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Topbar -->
            <div id="topbar-container"></div>

            <!-- Products Content -->
            <section class="products-content">

                <div class="products-header">
                    <div>
                        <h1 data-i18n="products.title">Products</h1>
                        <p class="page-subtitle" data-i18n="products.subtitle">Manage your inventory</p>
                    </div>
                    <button id="addProductButton" class="primary-button" data-i18n="products.addProduct">Add Product</button>
                </div>

                <div class="products-toolbar">
                    <div class="products-search-wrap">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <circle cx="7" cy="7" r="4.3" stroke="currentColor" stroke-width="1.4"/>
                            <path d="M13 13L10.3 10.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                        </svg>
                        <input
                            type="text"
                            id="productSearch"
                            data-i18n-placeholder="products.searchPlaceholder"
                            placeholder="Search products…"
                            autocomplete="off"
                        >
                    </div>
                </div>

                <!-- Table -->
                <div class="products-table-container" id="productsTableContainer">
                    <table class="products-table">
                        <thead>
                            <tr>
                                <th data-i18n="products.table.sku">SKU</th>
                                <th data-i18n="products.table.name">Name</th>
                                <th data-i18n="products.table.category">Category</th>
                                <th data-i18n="products.table.price">Price</th>
                                <th data-i18n="products.table.quantity">Quantity</th>
                                <th data-i18n="products.table.status">Status</th>
                                <th data-i18n="products.table.actions">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody"></tbody>
                    </table>
                </div>

                <!-- Empty State -->
                <div class="products-empty-state" id="productsEmptyState" style="display: none;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                    </svg>
                    <h3 data-i18n="products.emptyTitle">No products yet</h3>
                    <p data-i18n="products.emptyDesc">Add your first product to get started</p>
                    <button id="emptyAddProductButton" class="primary-button" data-i18n="products.addProduct">Add Product</button>
                </div>

            </section>

        </main>

    </div>

    <!-- ============================================================
         Product Modal — Inline (always present in DOM)
         ============================================================ -->
    <div id="productModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <div>
                    <h2 data-i18n="products.modal.title">Add Product</h2>
                    <p data-i18n="products.modal.subtitle">Add a new product to your inventory</p>
                </div>
                <button type="button" id="closeProductModal" class="modal-close">×</button>
            </div>

            <form id="productForm" class="product-form">
                <div class="form-group">
                    <label for="productName">
                        <span data-i18n="products.form.name">Product Name</span>
                        <span class="required">*</span>
                    </label>
                    <input type="text" id="productName" name="name" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="productSku"><span data-i18n="products.form.sku">SKU</span></label>
                    <input type="text" id="productSku" name="sku" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="productBarcode"><span data-i18n="products.form.barcode">Barcode</span></label>
                    <input type="text" id="productBarcode" name="barcode" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="productCategory"><span data-i18n="products.form.category">Category</span></label>
                    <input type="text" id="productCategory" name="category" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="productPriceRetail">
                        <span data-i18n="products.form.priceRetail">Retail Price</span>
                        <span class="required">*</span>
                    </label>
                    <input type="number" id="productPriceRetail" name="priceRetail" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="productPriceWholesale"><span data-i18n="products.form.priceWholesale">Wholesale Price</span></label>
                    <input type="number" id="productPriceWholesale" name="priceWholesale" min="0" step="0.01">
                </div>

                <div class="form-group">
                    <label for="productUom"><span data-i18n="products.form.uom">Unit of Measure</span></label>
                    <select id="productUom" name="uom">
                        <option value="pcs">Piece (pcs)</option>
                        <option value="kg">Kilogram (kg)</option>
                        <option value="g">Gram (g)</option>
                        <option value="l">Liter (l)</option>
                        <option value="ml">Milliliter (ml)</option>
                        <option value="box">Box</option>
                        <option value="pack">Pack</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="productUomRatio"><span data-i18n="products.form.uomRatio">UOM Ratio (1 Box = ? pcs)</span></label>
                    <input type="number" id="productUomRatio" name="uomRatio" min="1" step="1" value="1">
                </div>

                <div class="form-group">
                    <label for="productQuantity"><span data-i18n="products.form.quantity">Quantity</span></label>
                    <input type="number" id="productQuantity" name="quantity" min="0" step="1" value="0">
                </div>

                <div class="form-group">
                    <label for="productMinStock"><span data-i18n="products.form.minStock">Minimum Stock</span></label>
                    <input type="number" id="productMinStock" name="minStock" min="0" step="1" value="0">
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="productActive" name="active" checked>
                        <span data-i18n="products.form.active">Active Product</span>
                    </label>
                </div>

                <div id="productFormError" class="form-error" style="display: none;"></div>

                <div class="modal-actions">
                    <button type="button" id="cancelProductButton" class="secondary-button">
                        <span data-i18n="common.cancel">Cancel</span>
                    </button>
                    <button type="submit" id="saveProductButton" class="primary-button">
                        <span data-i18n="common.save">Save Product</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/js/products.js"></script>

</body>

</html>
